<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile - Productivity-Graveyard</title>
    <script type="module" src="/src/main.js" defer></script>
    <script type="module" src="/src/pages/profile.js" defer></script>
    <link rel="stylesheet" href="/src/css/style.css" />
    <link rel="stylesheet" href="/src/css/profile.css" />
  </head>

  <body>
    <header></header>
    <main>
      <section id="banner" class="small-banner">
        <div class="banner-container small-banner">
          <div class="banner-text small-banner">
            <h1 class="banner-h1">PROFILE</h1>
          </div>
          <div class="banner-curve banner-curve-background"></div>
          <img
            class="banner-grass grass-left-before"
            src="./src/assets/img/Grass.png"
            alt="grass"
          />
          <img
            class="banner-grass"
            src="./src/assets/img/Grass.png"
            alt="grass"
          />
          <img
            class="banner-grass grass-left"
            src="./src/assets/img/Grass.png"
            alt="grass"
          />
          <img
            class="banner-grass grass-right"
            src="./src/assets/img/Grass.png"
            alt="grass"
          />
          <img
            class="banner-grass grass-right-after"
            src="./src/assets/img/Grass.png"
            alt="grass"
          />
          <div class="banner-curve"></div>
        </div>
      </section>

      <section id="profile">
        <div class="profile-container container">
          <div class="profile-details">
            <button id="edit-profile-btn" type="button" class="icon-btn">
              Edit profile
            </button>
            <img
              src=""
              alt="Profile Picture"
              class="profile-picture"
              id="profile-picture"
            />
            <div class="profile-info">
              <span class="profile-name" id="profile-name"></span>
              <p id="profile-nickname"></p>
            </div>
            <div class="location" id="profile-location"></div>
            <div class="burried" id="profile-burried"></div>
            <div class="member-since" id="profile-member-since"></div>
          </div>
          <div class="recent-funerals">
            <h2>Your recent funerals</h2>
            <div class="users-projects"></div>
            <div class="pagination"></div>
            <!-- Projects will be dynamically rendered here -->
          </div>
        </div>
      </section>
    </main>
    <footer></footer>
    <!-- Edit Profile Modal -->
    <div
      id="edit-modal"
      class="modal"
      aria-hidden="true"
      role="dialog"
      aria-modal="true"
      aria-labelledby="edit-modal-title"
    >
      <div class="modal-backdrop" data-close="true"></div>

      <div class="modal-dialog" role="document">
        <header class="modal-header">
          <h2 id="edit-modal-title">Edit profile</h2>
          <button
            type="button"
            class="modal-close"
            id="edit-modal-close"
            aria-label="Close"
          >
            ✕
          </button>
        </header>

        <form id="edit-modal-form" class="modal-body">
          <label>
            First name
            <input type="text" name="firstName" id="modal-firstName" />
          </label>

          <label>
            Last name
            <input type="text" name="lastName" id="modal-lastName" />
          </label>

          <label>
            Username
            <input type="text" name="username" id="modal-username" />
          </label>

          <label>
            Bio
            <input type="text" name="bio" id="modal-bio" />
          </label>

          <label>
            Avatar URL
            <input type="url" name="avatarUrl" id="modal-avatarUrl" />
          </label>

          <div class="modal-actions">
            <button type="submit" id="edit-modal-save">Save</button>
            <button type="button" id="edit-modal-cancel">Cancel</button>
            <span id="edit-modal-status" class="modal-status"></span>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
