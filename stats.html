<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stats - Productivity-Graveyard</title>
    <link rel="stylesheet" href="/src/css/style.css" />
    <link rel="stylesheet" href="/src/css/shared/bannerShared.css" />
    <link rel="stylesheet" href="/src/css/stats.css" />
    <link
      rel="stylesheet"
      href="/src/components/features/stats/statsCards.css"
    />
  </head>
  <body>
    <header></header>
    <main>
      <section id="banner">
        <div class="banner-container">
          <div class="banner-text">
            <h1 class="banner-h1">STATS</h1>
          </div>
          <p class="stats-quote">
            "Here lie the numbers of projects that never saw the light of day."
          </p>
          <div class="banner-curve banner-curve-background"></div>
          <img
            class="banner-grass grass-left-before"
            src="./src/assets/img/Grass.png"
            alt="grass"
          />
          <img
            class="banner-grass"
            src="./src/assets/img/Grass.png"
            alt="grass"
          />
          <img
            class="banner-grass grass-left"
            src="./src/assets/img/Grass.png"
            alt="grass"
          />
          <img
            class="banner-grass grass-right"
            src="./src/assets/img/Grass.png"
            alt="grass"
          />
          <img
            class="banner-grass grass-right-after"
            src="./src/assets/img/Grass.png"
            alt="grass"
          />
          <div class="banner-curve"></div>
        </div>
      </section>
      <section id="stats-overview">
        <div class="stats-overview-container"></div>
      </section>
    </main>
    <footer></footer>

    <script type="module" src="/src/main.js" defer></script>
    <script type="module" src="/src/pages/stats.js" defer></script>
  </body>
</html>
