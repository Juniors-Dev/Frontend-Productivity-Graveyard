<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Graveyard - Productivity-Graveyard</title>
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./src/assets/img/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./src/assets/img/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./src/assets/img/favicon-16x16.png"
    />
    <link rel="manifest" href="/site.webmanifest" />
    <script type="module" src="/src/main.js" defer></script>
    <script type="module" src="/src/pages/graveyard.js" defer></script>
    <link rel="stylesheet" href="/src/css/style.css" />
    <link rel="stylesheet" href="/src/css/graveyard.css" />
  </head>

  <body>
    <header></header>
    <main>
      <section id="banner" class="small-banner">
        <div class="banner-container small-banner">
          <div class="banner-text small-banner">
            <h1 class="banner-h1">GRAVEYARD</h1>
          </div>
          <div class="banner-curve banner-curve-background"></div>
          <img
            class="banner-grass grass-left-before"
            src="./src/assets/img/Grass.png"
            alt="grass"
          />
          <img
            class="banner-grass"
            src="./src/assets/img/Grass.png"
            alt="grass"
          />
          <img
            class="banner-grass grass-left"
            src="./src/assets/img/Grass.png"
            alt="grass"
          />
          <img
            class="banner-grass grass-right"
            src="./src/assets/img/Grass.png"
            alt="grass"
          />
          <img
            class="banner-grass grass-right-after"
            src="./src/assets/img/Grass.png"
            alt="grass"
          />
          <div class="banner-curve"></div>
        </div>
      </section>
      <section id="graveyard">
        <div class="container">
          <div class="graveyard-header">
            <div>
              <h2>Recent Funerals</h2>
              <p>Light a candle for the funerals you appreciate</p>
            </div>
            <a class="btn-beige ml-auto" href="/bury.html">+ New Funeral</a>
          </div>
          <div class="bury-project-container">
            <img
              class="bury-project-bg-img"
              src="./src/assets/img/Vector.png"
              alt="sythe"
              aria-hidden="true"
            />
            <div class="bury-project-img">
              <img
                src="./src/assets/img/searching-reaper.png"
                alt="searching reaper"
              />
            </div>
            <div class="bury-text">
              <form id="search-form">
                <h3 class="centered">Search The Graveyard</h3>

                <!-- Query input -->
                <div class="input-wrapper">
                  <div class="input-icon-container">
                    <span
                      class="input-icon search-icon"
                      aria-hidden="true"
                    ></span>
                    <input
                      type="search"
                      id="query"
                      name="query"
                      placeholder="Find a grave"
                    />
                  </div>
                  <span class="error-message" id="query-error"></span>
                </div>

                <!-- Filter buttons -->
                <div class="filter-buttons-container">
                  <button class="btn-beige" type="submit">Search</button>
                  <button
                    type="reset"
                    class="btn-beige btn-small"
                    id="clear-search"
                  >
                    Clear Search
                  </button>
                  <button
                    type="button"
                    class="btn-beige btn-small"
                    id="toggle-filters"
                  >
                    Advanced Filters ▾
                  </button>
                </div>

                <!-- Advanced filters collapsible -->
                <div id="advanced-filters">
                  <div class="order-selectors">
                    <div>
                      <label for="order-selector">Order</label>
                      <select name="order" id="order-selector">
                        <option value="asc">Ascending</option>
                        <option value="desc" selected>Descending</option>
                      </select>
                    </div>
                    <div>
                      <label for="orderby-selector">Sort By</label>
                      <select name="orderBy" id="orderby-selector">
                        <option value="name">Name</option>
                        <option value="createdAt" selected>Created Date</option>
                        <option value="startDate">Start Date</option>
                        <option value="endDate">End Date</option>
                        <option value="status">Status</option>
                        <option value="commentCount">Comment Count</option>
                        <option value="upvoteCount">Upvote Count</option>
                      </select>
                    </div>
                    <div>
                      <label for="limit-selector">Results Per Page</label>
                      <select name="limit" id="limit-selector">
                        <option value="10" selected>10</option>
                        <option value="20">20</option>
                        <option value="30">30</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                      </select>
                    </div>
                  </div>

                  <!-- Project types -->
                  <div class="form-group">
                    <fieldset class="project-types-fieldset">
                      <legend class="project-types-legend">
                        Project Categories
                      </legend>
                      <div class="dropdown" id="categoryDropdown">
                        <button
                          type="button"
                          class="dropdown-toggle"
                          id="categoryDropdownToggle"
                        >
                          Select Categories
                        </button>
                        <div class="dropdown-menu" id="categoryDropdownMenu">
                          <!-- Dynamically filled with checkboxes -->
                        </div>
                      </div>
                      <span class="error-message" id="types-error"></span>
                    </fieldset>
                  </div>
                </div>
              </form>
            </div>
          </div>

          <div class="details-container"></div>
          <div class="results-indicators"></div>
          <div class="project-container"></div>
          <div class="pagination"></div>
        </div>
      </section>
    </main>
    <footer></footer>
  </body>
</html>
